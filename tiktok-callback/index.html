<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Video Studio — TikTok</title>
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 16px;color:#1f2937}a{color:#6d28d9}</style></head><body>
<p>Đang quay về Video Studio trên máy của bạn… / Returning to Video Studio on your computer…</p>
<p id="m"></p>
<script>
// Trang trung gian: TikTok chỉ chấp nhận redirect https công khai → chuyển nguyên ?code&state về web Studio chạy trên máy (127.0.0.1).
// Không lưu, không gửi đi đâu khác. Web Studio phải đang chạy (yarn dev, cổng 3000).
(function () {
  var target = "http://127.0.0.1:3000/api/tiktok/callback" + location.search;
  var a = document.createElement("a"); a.href = target; a.textContent = "Bấm vào đây nếu không tự chuyển / Click here";
  document.getElementById("m").appendChild(a);
  location.replace(target);
})();
</script></body></html>
